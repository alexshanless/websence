<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5T42PS65NL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5T42PS65NL');
    </script>
    <!-- PNG rather than SVG: an SVG favicon drawn with <text> renders in
         whatever font the viewer has locally, and Archivo Black is a webfont,
         so it fell back to Arial Black and varied by OS. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a202c" />

    <!--
      Title, description, robots, canonical, OG/Twitter tags, and the
      LocalBusiness JSON-LD are all injected here by scripts/prerender.mjs,
      one set per route, from what each page's <Seo> renders. This file is
      only the template prerender.mjs starts from — it is never served as
      the actual index.html. See src/components/Seo.jsx.
    -->
    <!--app-head-->

    <!-- Fonts are self-hosted (see src/fonts.css). Preloaded so the two
         faces start downloading with the stylesheet rather than after it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-black-400.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/roboto-variable.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
