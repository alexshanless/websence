<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG rather than SVG: an SVG favicon drawn with <text> renders in
         whatever font the viewer has locally, and Archivo Black is a webfont,
         so it fell back to Arial Black and varied by OS. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Custom websites for small businesses in Tacoma and the South Sound. Sites that bring in calls and booked jobs."
    />
    <meta name="theme-color" content="#1a202c" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://websencestudio.com/" />

    <!--
      Static fallbacks. The app rewrites these per route on render, but any
      crawler that does not execute JavaScript only ever sees what is here, so
      these must stand on their own as the home page's tags.
    -->
    <meta property="og:site_name" content="WEBSENCE" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://websencestudio.com/" />
    <meta
      property="og:title"
      content="Website Design for Tacoma Small Businesses | Websence"
    />
    <meta
      property="og:description"
      content="Custom websites for small businesses in Tacoma and the South Sound. Sites that bring in calls and booked jobs."
    />
    <meta
      property="og:image"
      content="https://websencestudio.com/assets/og-default.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Website Design for Tacoma Small Businesses | Websence"
    />
    <meta
      name="twitter:description"
      content="Custom websites for small businesses in Tacoma and the South Sound. Sites that bring in calls and booked jobs."
    />
    <meta
      name="twitter:image"
      content="https://websencestudio.com/assets/og-default.jpg"
    />

    <!-- Fonts are self-hosted (see src/fonts.css). Preloaded so the two
         faces start downloading with the stylesheet rather than after it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-black-400.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/roboto-variable.woff2"
      crossorigin
    />
    <title>Website Design for Tacoma Small Businesses | Websence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
