# Build and routing config lives here rather than in the Netlify UI, so a
# rebuild from a clean checkout produces the same site.

[build]
  command = "npm run build"
  # The build prerenders one HTML file per route into dist/client. dist/server
  # is a build-time artifact and is deleted before this directory is published.
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  # Pin the major version so a Netlify default bump cannot change the build.
  NODE_VERSION = "20"

# Real 301 rather than the client side redirect in App.jsx, so the redirect
# happens before any JavaScript runs and search engines see the status code.
[[redirects]]
  from = "/portfolio"
  to = "/work"
  status = 301
  force = true

# No route rules below this line, deliberately. Every route is now a real
# prerendered file — /services is dist/client/services/index.html, and so on —
# so Netlify serves each one directly. The rules that used to map these paths
# to the root index.html would now serve the home page's text on every URL.
#
# Unknown paths are answered by dist/client/404.html, which Netlify serves
# with a real 404 status automatically. It carries the prerendered NotFound
# page, marked noindex.

# Vite fingerprints these filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML is deliberately not cached long: each prerendered page carries the
# hashed asset names and its own body copy, so a stale copy would keep serving
# an old build. One rule per shape, since every route is now its own file.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
